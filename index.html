<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: data:; frame-src * about: data: blob:; connect-src 'self'; font-src 'self' data:">
<title>붉은별 3.0</title>
<link rel="stylesheet" href="css/os.css">
<link rel="stylesheet" href="css/apps.css">
</head>
<body>
<div id="screen">
  <div id="wallpaper"></div>
  <div id="desktop"></div>
  <div id="windows"></div>

  <div id="menubar">
    <span class="mb-item star" data-menu="star">★</span>
    <div id="menus"></div>
    <div class="tray">
      <span class="tray-btn" data-tray="ime" title="입력방식"><svg class="tray-flag" viewBox="0 0 20 14"><path d="M2 2c4-2 7 2 11 0s5-1 5-1v9s-1-1-5 1-7-2-11 0z" fill="#d81e1e"/><path d="M2 2v11" stroke="#900" stroke-width="1.4"/></svg></span>
      <span class="tray-btn" data-tray="volume" title="소리"><svg class="tray-vol" viewBox="0 0 20 16"><path d="M2 5h4l5-4v14l-5-4H2z" fill="#222"/><path class="vol-waves" d="M13 5c1.5 1.5 1.5 4.5 0 6M15.5 3c3 3 3 7 0 10" stroke="#222" stroke-width="1.5" fill="none"/><path class="vol-mute" d="M13 5l6 6M19 5l-6 6" stroke="#c00" stroke-width="1.6"/></svg></span>
      <span class="tray-btn" data-tray="net" title="망"><svg class="tray-fire" viewBox="0 0 14 18"><path d="M7 1c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 3-6 0 2 1 3 2 3-1-3 0-6 1-8z" fill="#e2231a"/><path d="M7 9c1 2 3 3 3 5a3 3 0 0 1-6 0c0-1 1-2 1.5-3 .2 1 .8 1.5 1.5 1.5C6.5 11 6.6 10 7 9z" fill="#ffb21e"/></svg></span>
      <span class="tray-btn" data-tray="clock" id="clock">08:34</span>
    </div>
  </div>

  <div id="ime">
    <span class="ime-dot" title="끌어서 옮기기"></span>
    <span class="ime-a" title="조선어/영어 전환 (Shift+Space)">A</span>
    <span class="ime-btn ime-width" title="전각/반각"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" fill="none" stroke="#222" stroke-width="1.3"/><path d="M8 2.5v11" stroke="#222" stroke-width="1.3"/></svg></span>
    <span class="ime-btn" title="한자/기호"><svg viewBox="0 0 16 16"><path d="M3 2l4 7-2 1z" fill="#555"/><path d="M5 10c2 0 4 1 4 3s-3 2-5 1c1-1 0-3 1-4z" fill="#999"/><path d="M10 2l3 2-4 6-2-1z" fill="#4a7"/></svg></span>
    <span class="ime-btn" title="필기입력"><svg viewBox="0 0 16 16"><path d="M2 12l8-9 3 3-9 8z" fill="#e88b2b"/><path d="M10 3l2-2 3 3-2 2z" fill="#c33"/><path d="M2 12l2 2-3 1z" fill="#333"/></svg></span>
    <span class="ime-q" title="도움말">?</span>
  </div>

  <div id="dock"><div class="shelf"></div><div class="icons"></div></div>
  <div id="overlay-layer"></div>
</div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/lang/fr.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/de.js"></script>
<script src="js/lang/it.js"></script>
<script src="js/lang/pt.js"></script>
<script src="js/lang/ru.js"></script>
<script src="js/lang/zh.js"></script>
<script src="js/lang/ja.js"></script>
<script src="js/lang/ar.js"></script>
<script src="js/lang/ko.js"></script>
<script src="js/shell.js"></script>
<script src="js/ime.js"></script>
<script src="js/apps/browser.js"></script>
<script src="js/apps/files.js"></script>
<script src="js/apps/editor.js"></script>
<script src="js/apps/viewer.js"></script>
<script src="js/apps/calendar.js"></script>
<script src="js/apps/contacts.js"></script>
<script src="js/apps/calculator.js"></script>
<script src="js/apps/video.js"></script>
<script src="js/apps/search.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/apps/terminal.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
